apply plugin: 'com.android.application'

android {
    namespace 'com.mantramandiram.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mantramandiram.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    // The release keystore is NOT stored in this repo (it's a secret credential —
    // see native-apps/README.md for why, and where to download it from).
    // Place the downloaded .keystore file at native-apps/android/mantra-mandiram-release.keystore
    // and set the MM_KEYSTORE_PASSWORD environment variable before building a release.
    signingConfigs {
        release {
            def keystoreFile = file("../mantra-mandiram-release.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("MM_KEYSTORE_PASSWORD")
                keyAlias "mantramandiram"
                keyPassword System.getenv("MM_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
